services:
  - type: web
    name: iotbay-api
    runtime: python
    buildCommand: pip install uv && uv sync --no-group dev
    startCommand: uv run gunicorn --workers 2 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /api/health
    envVars:
      - key: IOTBAY_DATABASE_PATH
        value: /var/data/iotbay.sqlite3
      - key: IOTBAY_COOKIE_SECURE
        value: true
      - key: IOTBAY_COOKIE_SAMESITE
        value: None
      - key: IOTBAY_API_KEY
        sync: false
      - key: IOTBAY_ALLOWED_ORIGINS
        sync: false
    disk:
      name: iotbay-data
      mountPath: /var/data
      sizeGB: 1
