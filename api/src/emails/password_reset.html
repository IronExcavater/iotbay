<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <style>
$inline_styles
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="header">
          <p class="brand">IOTBay</p>
          <h1 class="title">Reset your password</h1>
        </div>
        <div class="content">
          <p class="copy">
            We received a request to reset the password for
            <strong>$email</strong>.
          </p>
          <a class="action-link" href="$reset_url">Reset your password</a>
          <p class="note">
            This link expires <strong>$formatted_expires_at</strong>.
          </p>
          <p class="footer">
            If you did not request this, you can ignore this email.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
