<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <style>
$inline_styles
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="header">
          <p class="brand">IOTBay</p>
          <h1 class="title">Complete your staff account</h1>
        </div>
        <div class="content">
          <p class="copy">
            Your superadmin invited <strong>$email</strong> to create a staff account.
          </p>
          <a class="action-link" href="$registration_url">Create your staff account</a>
          <p class="note">
            This link expires <strong>$formatted_expires_at</strong>.
          </p>
          <p class="footer">
            If you were not expecting this invitation, you can ignore this email.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
