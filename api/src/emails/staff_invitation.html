<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create your IoTBay staff account</title>
    <style>
      $inline_styles
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="header">
          <p class="brand">IoTBay</p>
          <h1 class="title">Complete your staff account</h1>
        </div>
        <div class="content">
          <p class="copy">
            Your superadmin invited <strong>$email</strong> to create a staff
            account.
          </p>
          <a class="action-link" href="$registration_url"
            >Create your staff account</a
          >
          <p class="note">
            This link expires <strong>$formatted_expires_at</strong>.
          </p>
          <p class="footer">
            If you were not expecting this invitation, you can ignore this
            email.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
