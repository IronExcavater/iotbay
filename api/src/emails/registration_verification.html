<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your IoTBay email</title>
    <style>
      $inline_styles
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="header">
          <p class="brand">IoTBay</p>
          <h1 class="title">Verify your email</h1>
        </div>
        <div class="content">
          <p class="copy">
            Finish creating your IoTBay account for
            <strong>$email</strong>.
          </p>
          <a class="action-link" href="$verification_url">Verify your email</a>
          <p class="note">
            This link expires <strong>$formatted_expires_at</strong>.
          </p>
          <p class="footer">
            If you did not start this signup, you can ignore this email.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
