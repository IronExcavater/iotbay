<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
    <style>
$inline_styles
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="header">
          <p class="brand">IOTBay</p>
          <h1 class="title">Verify your email</h1>
        </div>
        <div class="content">
          <p class="copy">
            Finish creating your IOTBay account for
            <strong>$email</strong>.
          </p>
          <div class="panel">
            <a class="action-link" href="$verification_url">Verify your email</a>
          </div>
          <p class="note">
            This link expires <strong>$formatted_expires_at</strong>.
          </p>
          <p class="footer">
            If you did not start this signup, you can ignore this email.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
