<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>IoTBay</title>
        <script>
            // Redirect to index.html preserving the path for React Router.
            // Encodes the path as a query param that index.html reads and replaces via history API.
            var l = window.location
            l.replace(
                l.protocol +
                    '//' +
                    l.host +
                    l.pathname
                        .split('/')
                        .slice(0, 1 + 1)
                        .join('/') +
                    '/?/' +
                    l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') +
                    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
            )
        </script>
    </head>
    <body></body>
</html>
