name: Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-static:
    name: Web / Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: jdx/mise-action@v4.0.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck, lint, and format check
        run: npm run -w web check:all

  web-build:
    name: Web / Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      IOTBAY_API_KEY: ci-api-key

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: jdx/mise-action@v4.0.1

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build frontend
        run: npm run -w web build

  api-static:
    name: API / Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      IOTBAY_API_KEY: ci-api-key

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: jdx/mise-action@v4.0.1

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Sync API environment
        run: npm run -w api sync

      - name: Typecheck, lint, and format check
        run: npm run -w api check:all

  api-tests:
    name: API / Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      IOTBAY_API_KEY: ci-api-key

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: jdx/mise-action@v4.0.1

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Sync API environment
        run: npm run -w api sync

      - name: Run tests
        run: npm run -w api test

  api-build:
    name: API / Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up toolchain
        uses: jdx/mise-action@v4.0.1

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Build backend package
        run: npm run -w api build
